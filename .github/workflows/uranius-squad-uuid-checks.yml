name: Uranius Squad UUID read-only checks

on:
  push:
    branches: [main]
    paths:
      - 'database/reconstruction/squad/**'
      - 'database/synthetic-world/**'
      - 'scripts/run-uranius-hosted-smoke.mjs'
      - 'scripts/run-approved-overview-https-windows.ps1'
      - 'tests/uraniusSquad*.test.mjs'
      - 'tests/uraniusRider018SourceReview.test.mjs'
      - '.github/workflows/uranius-squad-uuid-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restricted-squad:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only Squad and UUID A/B route checks
        run: |
          node --test \
            tests/uraniusOriginalNineSkillAvailability.test.mjs \
            tests/uraniusRider018SourceReview.test.mjs \
            tests/uraniusSquadUuidRouteIsolation.test.mjs \
            tests/uraniusSquadUuidIntegrationBoundary.test.mjs \
            tests/uraniusSquadRouteIsolation.test.mjs \
            tests/uraniusSquadHostedFrontendBoundary.test.mjs \
            tests/uraniusSquadPreviewReview.test.mjs \
            tests/uraniusSquadHttpsStartupPreflight.test.mjs \
            tests/uraniusSquadHostedBundle.test.mjs
